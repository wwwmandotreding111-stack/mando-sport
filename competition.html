<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172433"><title>البطولة | MANDO SPORT</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f3f5;color:#263442;font-family:Tahoma,Arial,sans-serif;line-height:1.8}a{color:inherit;text-decoration:none}.top{background:#fff;padding:14px 4%;border-bottom:1px solid #e0e5ea;display:flex;justify-content:space-between}.brand{font-weight:950;font-size:21px;color:#1d2b3a}.brand b{color:#b98937}.top a:last-child{font-size:12px;color:#926b2b}.container{width:min(1120px,94%);margin:24px auto}.hero{background:linear-gradient(115deg,#1b2a39,#30485d);color:#fff;padding:24px;border-radius:10px;margin-bottom:15px}.hero small{color:#f0d28d;font-weight:900}.hero h1{margin:6px 0;font-size:27px}.hero p{margin:0;color:#d2dbe4;font-size:12px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px}.panel{background:#fff;border:1px solid #e0e5ea;border-radius:9px;padding:16px;margin-bottom:14px;min-width:0}.panel h2{font-size:17px;margin:0 0 12px}.days{display:flex;gap:6px;overflow:auto;padding:2px 0 12px}.days button{border:1px solid #e0e5ea;background:#f8f9fa;border-radius:5px;padding:7px 12px;white-space:nowrap;font:inherit;font-size:11px}.days button.active{background:#27394b;color:#fff}.matches{display:grid;gap:8px}.match{display:grid;grid-template-columns:1fr 90px 1fr;align-items:center;gap:8px;padding:11px;border:1px solid #e8ecf0;border-radius:7px;text-align:center}.team{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;min-width:0}.team img{width:28px;height:28px;object-fit:contain}.team.home{justify-content:flex-end}.team.away{justify-content:flex-start}.team span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.score{font-weight:950;font-size:17px}.status{font-size:10px;color:#8a95a2}.status.live{color:#d22e3a;font-weight:900}.status.done{color:#248454}.empty{padding:20px;text-align:center;color:#8994a0;font-size:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:540px;font-size:11px}th,td{text-align:right;padding:9px 7px;border-bottom:1px solid #edf0f3;white-space:nowrap}th{background:#f5f6f8;color:#936c2b}td img{width:19px;height:19px;object-fit:contain;vertical-align:middle;margin-left:5px}.news{display:grid;gap:9px}.news a{display:flex;gap:9px;align-items:center;padding:9px;border-bottom:1px solid #edf0f3}.news img{width:70px;height:54px;object-fit:cover;border-radius:5px;background:#edf0f4}.news strong{font-size:11px;line-height:1.6}.news small{display:block;color:#8994a0;font-size:9px}@media(max-width:800px){.layout{grid-template-columns:1fr}.hero h1{font-size:22px}.panel{padding:12px}}@media(max-width:500px){.match{grid-template-columns:minmax(0,1fr) 66px minmax(0,1fr);gap:4px;padding:8px}.team{font-size:10px;gap:4px}.team img{width:23px;height:23px}.score{font-size:15px}}
</style></head><body><header class="top"><a class="brand" href="/">MANDO <b>SPORT</b></a><a href="/">العودة للرئيسية ←</a></header>
<main class="container"><section class="hero"><small>مركز البطولة</small><h1 id="competition-title">البطولة</h1><p>المباريات والنتائج وترتيب الفرق وآخر الأخبار.</p></section>
<div class="layout"><div><section class="panel"><h2>المباريات والنتائج</h2><div class="days" id="days"></div><div class="matches" id="matches"><div class="empty">جارٍ تحميل المباريات...</div></div></section>
<section class="panel"><h2>جدول الترتيب</h2><div class="table-wrap" id="standings"><div class="empty">جارٍ تحميل الترتيب...</div></div></section></div>
<aside><section class="panel"><h2>آخر أخبار البطولة</h2><div class="news" id="news"><div class="empty">جارٍ تحميل الأخبار...</div></div></section><section class="panel"><h2>بطولات أخرى</h2><a class="news" href="/competition.html?code=PL">الدوري الإنجليزي</a><a class="news" href="/competition.html?code=PD">الدوري الإسباني</a><a class="news" href="/competition.html?code=CL">دوري أبطال أوروبا</a><a class="news" href="/competition.html?code=SPL">الدوري السعودي</a></section></aside></div></main>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params=new URLSearchParams(location.search),code=(params.get('code')||'PL').toUpperCase();
const leagues={PL:['الدوري الإنجليزي الممتاز','الدوري الإنجليزي'],PD:['الدوري الإسباني','الدوري الإسباني'],SA:['الدوري الإيطالي','الدوري الإيطالي'],BL1:['الدوري الألماني','الدوري الألماني'],FL1:['الدوري الفرنسي','الدوري الفرنسي'],CL:['دوري أبطال أوروبا','دوري أبطال أوروبا'],SPL:['الدوري السعودي','الدوري السعودي'],MLS:['الدوري الأمريكي','الدوري الأمريكي']};
const league=leagues[code]||leagues.PL;document.getElementById('competition-title').textContent=league[0];document.title=league[0]+' | MANDO SPORT';
let selectedDate=new Date();
const dateString=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const names=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
function renderDays(){const host=document.getElementById('days');host.innerHTML='';[-2,-1,0,1,2,3,4].forEach(offset=>{const d=new Date();d.setDate(d.getDate()+offset);const b=document.createElement('button');b.textContent=offset===-1?'أمس':offset===0?'اليوم':offset===1?'غداً':names[d.getDay()]+' '+d.getDate();b.className=offset===0?'active':'';b.addEventListener('click',()=>{selectedDate=d;host.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));loadMatches();});host.appendChild(b);});}
function statusLabel(s){return ({IN_PLAY:'مباشرة الآن',PAUSED:'استراحة',FINISHED:'انتهت',SCHEDULED:'لم تبدأ',POSTPONED:'مؤجلة'})[s]||'موعد المباراة';}
async function loadMatches(){const host=document.getElementById('matches');host.innerHTML='<div class="empty">جارٍ تحميل المباريات...</div>';try{const r=await fetch('/api/matches?date='+dateString(selectedDate)+'&competition='+code,{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'تعذر تحميل المباريات');host.innerHTML=d.matches?.length?d.matches.map(m=>'<a class="match" href="/match.html?competition='+encodeURIComponent(code)+'&id='+encodeURIComponent(m.id)+'"><span class="team home"><span>'+esc(m.home)+'</span>'+(m.homeCrest?'<img src="'+esc(m.homeCrest)+'" alt="">':'')+'</span><span><strong class="score">'+(m.homeScore!==null&&m.awayScore!==null?esc(m.homeScore)+' - '+esc(m.awayScore):new Date(m.utcDate).toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'}))+'</strong><small class="status '+(m.status==='IN_PLAY'?'live':m.status==='FINISHED'?'done':'')+'">'+statusLabel(m.status)+'</small></span><span class="team away">'+(m.awayCrest?'<img src="'+esc(m.awayCrest)+'" alt="">':'')+'<span>'+esc(m.away)+'</span></span></a>').join(''):'<div class="empty">لا توجد مباريات مسجلة لهذا اليوم.</div>';}catch(e){host.innerHTML='<div class="empty">'+esc(e.message)+'</div>';}}
async function loadStandings(){const host=document.getElementById('standings');try{const r=await fetch('/api/standings?competition='+code);const d=await r.json();if(!r.ok)throw new Error(d.error||'تعذر تحميل الترتيب');host.innerHTML=d.table?.length?'<table><thead><tr><th>#</th><th>الفريق</th><th>لعب</th><th>فاز</th><th>تعادل</th><th>خسر</th><th>له</th><th>عليه</th><th>نقاط</th></tr></thead><tbody>'+d.table.map(x=>'<tr><td>'+esc(x.position)+'</td><td>'+(x.crest?'<img src="'+esc(x.crest)+'" alt="">':'')+esc(x.team)+'</td><td>'+esc(x.played??'—')+'</td><td>'+esc(x.won??'—')+'</td><td>'+esc(x.drawn??'—')+'</td><td>'+esc(x.lost??'—')+'</td><td>'+esc(x.goalsFor??'—')+'</td><td>'+esc(x.goalsAgainst??'—')+'</td><td><b>'+esc(x.points??'—')+'</b></td></tr>').join('')+'</tbody></table>':'<div class="empty">لا يتوفر ترتيب حالياً.</div>';}catch(e){host.innerHTML='<div class="empty">'+esc(e.message)+'</div>';}}
async function loadNews(){const host=document.getElementById('news');try{const r=await fetch('/api/news');const d=await r.json();const items=(d.articles||[]).filter(x=>(x.category||'').includes(league[1])||x.category==='أخبار عربية').slice(0,8);host.innerHTML=items.length?items.map(x=>'<a href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">'+(x.image?'<img src="'+esc(x.image)+'" alt="">':'')+'<span><strong>'+esc(x.title)+'</strong><small>'+esc(x.source||'مصدر إخباري')+'</small></span></a>').join(''):'<div class="empty">لا توجد أخبار مرتبطة حالياً.</div>';}catch(e){host.innerHTML='<div class="empty">تعذر تحميل الأخبار.</div>';}}
renderDays();loadMatches();loadStandings();loadNews();setInterval(loadMatches,60000);setInterval(loadNews,600000);
</script></body></html>
