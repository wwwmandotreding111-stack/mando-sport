<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="تابع ترتيب هدافي الدوريات والبطولات الكروية، وعدد أهداف كل لاعب وفريقه، مع تحديثات إحصائية على MANDO SPORT.">
<meta name="theme-color" content="#07111b"><title>ترتيب الهدافين | MANDO SPORT</title>
<style>
:root{color-scheme:dark;--bg:#07111b;--panel:#102030;--line:#294054;--gold:#d9ad5b;--gold2:#f2d18b;--text:#edf3f8;--muted:#9aabba}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -18%,#263d5355,transparent 44%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7}
a{color:inherit;text-decoration:none}.top{position:sticky;top:0;z-index:20;background:#07111bf2;border-bottom:1px solid #d9ad5b45;backdrop-filter:blur(16px);padding:14px max(3%,calc((100% - 1100px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:1000;font-size:21px}.brand b{color:var(--gold2)}.top>a:last-child{font-size:12px;color:var(--gold2)}
.container{width:min(1100px,94%);margin:25px auto}.hero,.panel{background:linear-gradient(145deg,#142536,#0c1925);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}.hero{background:radial-gradient(circle at 85% 20%,#d9ad5b20,transparent 35%),linear-gradient(115deg,#172e42,#0e1c2a)}h1{margin:0;color:#fff;font-size:clamp(22px,4vw,32px)}.hero p{margin:5px 0 0;color:#b8c7d4;font-size:12px}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}select,button{font:inherit;border-radius:8px;padding:10px 13px}select{background:#081622;border:1px solid #40566b;color:#fff}button{background:linear-gradient(145deg,#f0d18d,#c29142);border:0;color:#172432;font-weight:900;cursor:pointer}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:560px}th,td{padding:11px 10px;border-bottom:1px solid #ffffff12;text-align:right;font-size:12px}th{color:var(--gold2);font-size:11px;background:#ffffff06}td.rank{color:var(--gold2);font-weight:950;width:45px}td.player{display:flex;align-items:center;gap:10px;font-weight:850}.avatar{width:36px;height:36px;flex:0 0 36px;border-radius:50%;object-fit:cover;background:#203449}.goals{font-size:17px;font-weight:1000;color:var(--gold2)}.state{text-align:center;padding:24px;color:var(--muted);font-size:12px}.updated{font-size:10px;color:var(--muted);margin-top:10px}
@media(max-width:600px){.hero,.panel{padding:14px}.top{padding:12px 4%}}
</style></head>
<body><header class="top"><a class="brand" href="/">MANDO <b>SPORT</b></a><a href="/">العودة للرئيسية ←</a></header>
<main class="container"><section class="hero"><h1>ترتيب هدافي البطولات</h1><p>قائمة الهدافين بحسب بيانات مزوّد الإحصائيات الرياضي.</p><div class="filters"><select id="competition" aria-label="اختر البطولة"><option value="">كل البطولات المتاحة</option><option value="PL">الدوري الإنجليزي</option><option value="PD">الدوري الإسباني</option><option value="SA">الدوري الإيطالي</option><option value="BL1">الدوري الألماني</option><option value="FL1">الدوري الفرنسي</option><option value="SPL">الدوري السعودي</option><option value="MLS">الدوري الأمريكي</option></select><button id="refresh" type="button">تحديث القائمة</button></div></section>
<section class="panel"><div id="status" class="state">جارٍ تحميل ترتيب الهدافين...</div><div class="table-wrap" id="results" hidden></div><div class="updated" id="updated"></div></section></main>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const select=document.getElementById('competition'),status=document.getElementById('status'),results=document.getElementById('results');
async function load(){status.hidden=false;status.textContent='جارٍ تحديث ترتيب الهدافين...';results.hidden=true;try{const q=select.value?'?competition='+encodeURIComponent(select.value):'';const r=await fetch('/api/scorers'+q,{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'تعذر تحميل الهدافين');const rows=d.scorers||[];if(!rows.length)throw new Error('لا تتوفر بيانات الهدافين لهذه البطولة حالياً.');results.innerHTML='<table><thead><tr><th>#</th><th>اللاعب</th><th>الفريق</th><th>البطولة</th><th>الأهداف</th></tr></thead><tbody>'+rows.map((p,i)=>'<tr><td class="rank">'+(i+1)+'</td><td class="player">'+(p.image?'<img class="avatar" src="'+esc(p.image)+'" alt="" loading="lazy">':'<span class="avatar"></span>')+'<a href="/player.html?league='+encodeURIComponent(p.league)+'&id='+encodeURIComponent(p.id)+'&name='+encodeURIComponent(p.name)+'">'+esc(p.name)+'</a></td><td>'+esc(p.team||'—')+'</td><td>'+esc(p.competition)+'</td><td class="goals">'+esc(p.goals)+'</td></tr>').join('')+'</tbody></table>';results.hidden=false;status.hidden=true;document.getElementById('updated').textContent='آخر تحديث: '+new Date(d.updatedAt).toLocaleString('ar')+(d.partial?' · بعض البطولات غير متاحة حالياً':'');}catch(e){status.hidden=false;status.textContent=e.message;}}
select.addEventListener('change',load);document.getElementById('refresh').addEventListener('click',load);load();
</script></body></html>
