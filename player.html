<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صفحة اللاعب | MANDO SPORT</title>
<style>*{box-sizing:border-box}:root{color-scheme:dark;--bg:#080a0f;--panel:#111722;--gold:#e2b85f;--gold2:#f5d995;--muted:#98a4b5;--line:#273244;--white:#f5f6f8}body{margin:0;background:radial-gradient(ellipse at 50% -18%,#45321755,transparent 42%),var(--bg);color:var(--white);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.75}a{color:inherit;text-decoration:none}.top{position:sticky;top:0;z-index:20;background:#080a0fee;border-bottom:1px solid #ffffff14;backdrop-filter:blur(16px);padding:12px max(4%,calc((100% - 950px)/2));display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.brand{font-size:21px;font-weight:950;color:#f5f6f8}.brand b{color:var(--gold)}.top>a:last-child{font-size:12px;color:var(--gold2)}.subnav{display:flex;gap:7px;overflow:auto;white-space:nowrap}.subnav a{font-size:12px;color:#c0cad7;padding:7px 10px;border-radius:8px}.subnav a:hover{background:#e2b85f18;color:var(--gold2)}.container{width:min(900px,94%);margin:24px auto}.hero{background:radial-gradient(ellipse at 85% 25%,#b7833440,transparent 40%),linear-gradient(115deg,#1b202a,#0b0e14);border:1px solid #6b5128;color:#fff;padding:25px;border-radius:17px;display:flex;align-items:center;gap:20px}.hero img{width:125px;height:125px;object-fit:contain;border-radius:50%;background:#ffffff14}.hero h1{margin:0;font-size:26px}.hero p{margin:5px 0;color:#c3ccd8;font-size:12px}.panel{background:linear-gradient(145deg,#141c28,#0f151e);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}.panel h2{font-size:16px;margin:0 0 12px}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.fact{padding:13px;background:#0c121b;border:1px solid #273244;border-radius:9px}.fact small{display:block;color:var(--muted);font-size:10px}.fact strong{font-size:13px}@media(max-width:600px){.hero img{width:90px;height:90px}.hero h1{font-size:21px}.facts{grid-template-columns:repeat(2,1fr)}.top{gap:8px}.subnav{width:100%;order:3}}</style></head><body><header class="top"><a class="brand" href="/">MANDO <b>SPORT</b></a><a href="/">العودة للرئيسية ←</a><nav class="subnav" aria-label="التنقل السريع"><a href="/">الرئيسية</a><a href="/#matches">مباريات اليوم</a><a href="/#news">آخر الأخبار</a><a href="/competition.html?code=CL">دوري الأبطال</a><a href="/search.html">بحث</a></nav></header><main class="container"><div id="player-root" class="panel">جارٍ تحميل صفحة اللاعب...</div></main>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{const root=document.getElementById('player-root'),p=new URLSearchParams(location.search),id=p.get('id'),league=p.get('league')||'eng.1',fallbackName=p.get('name')||'',fallbackImage=p.get('image')||'',fallbackDescription=p.get('description')||'',sourceUrl=p.get('source')||'';if(!id){root.textContent='رابط اللاعب غير صحيح.';return;}try{const r=await fetch('/api/player?id='+encodeURIComponent(id)+'&league='+encodeURIComponent(league));const d=await r.json();if(!r.ok)throw new Error(d.error||'تعذر تحميل اللاعب');const x=d.player||{},name=x.name||fallbackName,image=x.image||fallbackImage,description=fallbackDescription;document.title=name+' | MANDO SPORT';const facts=[['النادي',x.team],['المركز',x.position],['العمر',x.age],['الجنسية',x.nationality],['تاريخ الميلاد',x.birthDate],['مكان الولادة',x.birthPlace],['الطول',x.height],['الوزن',x.weight],['الرقم',x.number]].filter(f=>f[1]!==null&&f[1]!==undefined&&f[1]!=='');root.className='';root.innerHTML='<section class="hero">'+(image?'<img src="'+esc(image)+'" alt="">':'')+'<div><h1>'+esc(name||'ملف اللاعب')+'</h1><p>'+esc(x.team||description||'لاعب كرة قدم')+' · '+esc(x.position||'')+'</p><p>'+esc(x.nationality||'')+'</p>'+(sourceUrl?'<p><a href="'+esc(sourceUrl)+'" target="_blank" rel="noopener noreferrer" style="color:#ffe0a0">المصدر والملف الكامل ←</a></p>':'')+'</div></section><section class="panel"><h2 style="font-size:17px;margin:0 0 12px">معلومات اللاعب</h2><div class="facts">'+(facts.length?facts.map(f=>'<div class="fact"><small>'+esc(f[0])+'</small><strong>'+esc(f[1])+'</strong></div>').join(''):'<div class="fact"><small>معلومات إضافية</small><strong>البيانات التفصيلية غير متاحة من المصدر حالياً.</strong></div>')+'</div></section>';}catch(e){if(fallbackName){root.className='';root.innerHTML='<section class="hero">'+(fallbackImage?'<img src="'+esc(fallbackImage)+'" alt="">':'')+'<div><h1>'+esc(fallbackName)+'</h1><p>'+esc(fallbackDescription||'لاعب كرة قدم')+'</p>'+(sourceUrl?'<p><a href="'+esc(sourceUrl)+'" target="_blank" rel="noopener noreferrer" style="color:#ffe0a0">الملف الأصلي ←</a></p>':'')+'</div></section>';}else root.textContent=e.message;}})();
</script></body></html>
