<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صفحة اللاعب | MANDO SPORT</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f1f3f5;color:#263442;font-family:Tahoma,Arial,sans-serif;line-height:1.8}.top{background:#fff;padding:14px 4%;border-bottom:1px solid #e0e5ea;display:flex;justify-content:space-between}.brand{font-weight:950;font-size:21px;color:#1d2b3a;text-decoration:none}.brand b{color:#b98937}.top a:last-child{font-size:12px;color:#926b2b;text-decoration:none}.container{width:min(900px,94%);margin:24px auto}.hero{background:linear-gradient(115deg,#1b2a39,#30475b);color:#fff;padding:25px;border-radius:10px;display:flex;align-items:center;gap:20px}.hero img{width:125px;height:125px;object-fit:contain;border-radius:50%;background:#ffffff14}.hero h1{margin:0;font-size:26px}.hero p{margin:5px 0;color:#d4dce4;font-size:12px}.panel{background:#fff;border:1px solid #e0e5ea;border-radius:9px;padding:16px;margin-top:14px}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.fact{padding:13px;background:#f6f7f9;border-radius:7px}.fact small{display:block;color:#8994a0;font-size:10px}.fact strong{font-size:13px}@media(max-width:600px){.hero img{width:90px;height:90px}.hero h1{font-size:21px}.facts{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class="top"><a class="brand" href="/">MANDO <b>SPORT</b></a><a href="/">العودة للرئيسية ←</a></header><main class="container"><div id="player-root" class="panel">جارٍ تحميل صفحة اللاعب...</div></main>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{const root=document.getElementById('player-root'),p=new URLSearchParams(location.search),id=p.get('id'),league=p.get('league')||'eng.1';if(!id){root.textContent='رابط اللاعب غير صحيح.';return;}try{const r=await fetch('/api/player?id='+encodeURIComponent(id)+'&league='+encodeURIComponent(league));const d=await r.json();if(!r.ok)throw new Error(d.error||'تعذر تحميل اللاعب');const x=d.player;document.title=x.name+' | MANDO SPORT';const facts=[['النادي',x.team],['المركز',x.position],['العمر',x.age],['الجنسية',x.nationality],['تاريخ الميلاد',x.birthDate],['مكان الولادة',x.birthPlace],['الطول',x.height],['الوزن',x.weight],['الرقم',x.number]];root.className='';root.innerHTML='<section class="hero">'+(x.image?'<img src="'+esc(x.image)+'" alt="">':'')+'<div><h1>'+esc(x.name)+'</h1><p>'+esc(x.team)+' · '+esc(x.position)+'</p><p>'+esc(x.nationality)+'</p></div></section><section class="panel"><h2 style="font-size:17px;margin:0 0 12px">معلومات اللاعب</h2><div class="facts">'+facts.filter(f=>f[1]!==null&&f[1]!==undefined&&f[1]!=='').map(f=>'<div class="fact"><small>'+esc(f[0])+'</small><strong>'+esc(f[1])+'</strong></div>').join('')+'</div></section>';}catch(e){root.textContent=e.message;}})();
</script></body></html>
