<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172433"><title>مركز المباراة | MANDO SPORT</title>
<style>*{box-sizing:border-box}:root{color-scheme:dark;--bg:#080a0f;--panel:#111722;--gold:#e2b85f;--gold2:#f5d995;--muted:#98a4b5;--line:#273244;--white:#f5f6f8}body{margin:0;background:radial-gradient(ellipse at 50% -18%,#45321755,transparent 42%),var(--bg);color:var(--white);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.75}a{color:inherit;text-decoration:none}.top{position:sticky;top:0;z-index:20;background:#080a0fee;border-bottom:1px solid #ffffff14;backdrop-filter:blur(16px);padding:12px max(4%,calc((100% - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.brand{font-size:21px;font-weight:950;color:#f5f6f8}.brand b{color:var(--gold)}.top>a:last-child{font-size:12px;color:var(--gold2)}.subnav{display:flex;gap:7px;overflow:auto;white-space:nowrap}.subnav a{font-size:12px;color:#c0cad7;padding:7px 10px;border-radius:8px}.subnav a:hover{background:#e2b85f18;color:var(--gold2)}.container{width:min(1050px,94%);margin:24px auto}.crumb{font-size:11px;color:var(--muted);margin-bottom:12px}.panel{background:linear-gradient(145deg,#141c28,#0f151e);border:1px solid var(--line);border-radius:14px;padding:17px;margin-bottom:14px}.scoreboard{background:radial-gradient(ellipse at 50% 0%,#b7833440,transparent 60%),linear-gradient(115deg,#1b202a,#0b0e14);border:1px solid #6b5128;color:#fff;padding:clamp(20px,5vw,35px);border-radius:18px;text-align:center;box-shadow:0 18px 50px #0005}.comp{font-size:12px;color:var(--gold2)}.teams{display:grid;grid-template-columns:1fr 130px 1fr;align-items:center;gap:10px;margin:20px 0}.team{display:grid;justify-items:center;gap:8px;font-weight:900}.team img{width:70px;height:70px;object-fit:contain}.score{font-size:32px;font-weight:950;color:var(--gold2)}.state{font-size:12px;color:#d5dde5}.venue{font-size:11px;color:#c4cedb}.panel h2{font-size:16px;margin:0 0 12px;color:#f3f5f8}.statrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;border-bottom:1px solid #273244;padding:9px 0;font-size:12px}.statrow span:nth-child(2){text-align:center;color:var(--muted)}.statrow strong:last-child{text-align:left}.event{padding:10px 0;border-bottom:1px solid #273244;font-size:12px}.event small{color:var(--gold2);margin-left:8px}.statebox{text-align:center;padding:35px;color:var(--muted);font-size:13px}
.live-player{background:linear-gradient(145deg,#111c2b,#080d15);border:1px solid #34465c;border-radius:15px;padding:16px;margin:15px 0}.live-player-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.live-player-head h2{margin:0;font-size:16px}.live-pill{background:#4c1721;color:#ffb2b8;border:1px solid #a43b4b;border-radius:30px;padding:4px 10px;font-size:10px;font-weight:900}.player-screen{aspect-ratio:16/9;display:grid;place-items:center;text-align:center;padding:20px;background:radial-gradient(ellipse at center,#23364c,#05090e 70%);border:1px solid #26384b;border-radius:10px;color:#aebdce}.player-screen strong{display:block;color:#f4d68f;font-size:15px;margin-bottom:7px}.quality-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:12px}.quality-row span{font-size:11px;color:var(--muted);margin-left:4px}.quality-chip{border:1px solid #35465b;border-radius:7px;padding:5px 10px;font-size:10px;color:#9baabd;background:#101a27;opacity:.55}.player-note{font-size:10px;color:#8595a8;margin:10px 0 0}@media(max-width:600px){.teams{grid-template-columns:1fr 80px 1fr;gap:5px}.team img{width:52px;height:52px}.score{font-size:24px}.top{gap:8px}.subnav{width:100%;order:3}}</style></head><body><header class="top"><a class="brand" href="/">MANDO <b>SPORT</b></a><a href="/">العودة للرئيسية ←</a><nav class="subnav" aria-label="التنقل السريع"><a href="/">الرئيسية</a><a href="/#matches">مباريات اليوم</a><a href="/#news">آخر الأخبار</a><a href="/competition.html?code=CL">دوري الأبطال</a><a href="/search.html">بحث</a></nav></header>
<main class="container"><div class="crumb"><a href="/" style="color:inherit">الرئيسية</a> › مركز المباراة</div><div id="match-root" class="statebox">جارٍ تحميل تفاصيل المباراة...</div></main>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{const root=document.getElementById('match-root'),p=new URLSearchParams(location.search),id=p.get('id'),competition=p.get('competition')||'PL';if(!id){root.textContent='رابط المباراة غير صحيح.';return;}
try{const r=await fetch('/api/match?id='+encodeURIComponent(id)+'&competition='+encodeURIComponent(competition));const d=await r.json();if(!r.ok)throw new Error(d.error||'تعذر تحميل المباراة');const m=d.match;document.title=(m.name||'مركز المباراة')+' | MANDO SPORT';const score=(m.home.score!==null&&m.away.score!==null)?esc(m.home.score)+' - '+esc(m.away.score):'—';root.className='';
const live=['in','paused'].includes(String(m.state||'').toLowerCase())||/جارية|مباشر|الشوط|استراحة/i.test(m.status||'');
const player='<section class="live-player"><div class="live-player-head"><h2>البث المباشر للمباراة</h2>'+(live?'<span class="live-pill">● مباشر الآن</span>':'<span class="state">مركز المباراة</span>')+'</div><div class="player-screen"><div><strong>'+(live?'البث غير متاح حالياً':'سيظهر البث عند انطلاق المباراة')+'</strong><span>يلزم توفير رابط بث رسمي أو مرخّص لتشغيل الفيديو.</span></div></div><div class="quality-row"><span>الجودة</span><span class="quality-chip">360p</span><span class="quality-chip">480p</span><span class="quality-chip">720p</span><span class="quality-chip">1080p</span></div><p class="player-note">خيارات الجودة توضيحية حالياً، وسيتم تفعيلها عند ربط مصادر بث تدعم هذه الدقات.</p></section>';
root.innerHTML='<section class="scoreboard"><div class="comp">'+esc(m.competition||'كرة القدم')+'</div><div class="teams"><div class="team">'+(m.home.logo?'<img src="'+esc(m.home.logo)+'" alt="">':'⚽')+'<a href="/team.html?league='+encodeURIComponent(competition)+'&id='+encodeURIComponent(m.home.id||"")+'">'+esc(m.home.name)+'</a></div><div><div class="score">'+score+'</div><div class="state">'+esc(m.status||'موعد المباراة')+'</div></div><div class="team">'+(m.away.logo?'<img src="'+esc(m.away.logo)+'" alt="">':'⚽')+'<a href="/team.html?league='+encodeURIComponent(competition)+'&id='+encodeURIComponent(m.away.id||"")+'">'+esc(m.away.name)+'</a></div></div><div class="venue">'+(m.date?new Date(m.date).toLocaleString('ar',{dateStyle:'medium',timeStyle:'short'})+' · ':'')+esc(m.venue)+(m.city?' · '+esc(m.city):'')+'</div></section>'+player+
(d.statistics?.length?'<section class="panel"><h2>أرقام الفريقين</h2>'+d.statistics.map(group=>'<h3 style="font-size:13px;color:#9a742e">'+esc(group.team)+'</h3>'+group.statistics.map(s=>'<div class="statrow"><strong>'+esc(s.value)+'</strong><span>'+esc(s.name)+'</span><strong></strong></div>').join('')).join('')+'</section>':'')+
(d.events?.length?'<section class="panel"><h2>أحداث المباراة</h2>'+d.events.map(e=>'<div class="event"><small>'+esc(e.clock||e.period||'')+'</small>'+esc(e.text)+(e.team?' · '+esc(e.team):'')+'</div>').join('')+'</section>':'<section class="panel"><h2>أحداث المباراة</h2><div class="statebox">لا توجد أحداث مسجلة لهذه المباراة بعد.</div></section>')+
(d.articles?.length?'<section class="panel"><h2>تغطية ومقالات مرتبطة</h2>'+d.articles.map(a=>'<div class="event"><a href="'+esc(a.url)+'" target="_blank" rel="noopener noreferrer">'+esc(a.title)+' ←</a></div>').join('')+'</section>':'');
}catch(e){root.textContent=e.message;}})();
</script></body></html>
