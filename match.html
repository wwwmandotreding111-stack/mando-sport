<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172433"><title>مركز المباراة | MANDO SPORT</title>
<style>*{box-sizing:border-box}:root{color-scheme:dark;--bg:#080a0f;--panel:#111722;--gold:#e2b85f;--gold2:#f5d995;--muted:#98a4b5;--line:#273244;--white:#f5f6f8}body{margin:0;background:radial-gradient(ellipse at 50% -18%,#45321755,transparent 42%),var(--bg);color:var(--white);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.75}a{color:inherit;text-decoration:none}.top{position:sticky;top:0;z-index:20;background:#080a0fee;border-bottom:1px solid #ffffff14;backdrop-filter:blur(16px);padding:12px max(4%,calc((100% - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.brand{font-size:21px;font-weight:950;color:#f5f6f8}.brand b{color:var(--gold)}.top>a:last-child{font-size:12px;color:var(--gold2)}.subnav{display:flex;gap:7px;overflow:auto;white-space:nowrap}.subnav a{font-size:12px;color:#c0cad7;padding:7px 10px;border-radius:8px}.subnav a:hover{background:#e2b85f18;color:var(--gold2)}.container{width:min(1050px,94%);margin:24px auto}.crumb{font-size:11px;color:var(--muted);margin-bottom:12px}.panel{background:linear-gradient(145deg,#141c28,#0f151e);border:1px solid var(--line);border-radius:14px;padding:17px;margin-bottom:14px}.scoreboard{background:radial-gradient(ellipse at 50% 0%,#b7833440,transparent 60%),linear-gradient(115deg,#1b202a,#0b0e14);border:1px solid #6b5128;color:#fff;padding:clamp(20px,5vw,35px);border-radius:18px;text-align:center;box-shadow:0 18px 50px #0005}.comp{font-size:12px;color:var(--gold2)}.teams{display:grid;grid-template-columns:1fr 130px 1fr;align-items:center;gap:10px;margin:20px 0}.team{display:grid;justify-items:center;gap:8px;font-weight:900}.team img{width:70px;height:70px;object-fit:contain}.score{font-size:32px;font-weight:950;color:var(--gold2)}.state{font-size:12px;color:#d5dde5}.venue{font-size:11px;color:#c4cedb}.panel h2{font-size:16px;margin:0 0 12px;color:#f3f5f8}.statrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;border-bottom:1px solid #273244;padding:9px 0;font-size:12px}.statrow span:nth-child(2){text-align:center;color:var(--muted)}.statrow strong:last-child{text-align:left}.event{padding:10px 0;border-bottom:1px solid #273244;font-size:12px}.event small{color:var(--gold2);margin-left:8px}.statebox{text-align:center;padding:35px;color:var(--muted);font-size:13px}.lineups-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.lineup-card{background:#101923;border:1px solid #2b3a4c;border-radius:13px;padding:12px;min-width:0}.lineup-head{display:flex;align-items:center;justify-content:center;gap:9px;font-weight:900;margin-bottom:10px}.lineup-head img{width:30px;height:30px;object-fit:contain}.formation{font-size:10px;color:var(--gold2);font-weight:800}.pitch{position:relative;overflow:hidden;min-height:330px;padding:20px 8px;background:repeating-linear-gradient(0deg,#176044,#176044 48px,#15583e 48px,#15583e 96px);border:2px solid #d9e8d455;border-radius:9px}.pitch:before{content:'';position:absolute;inset:50% 0 auto;border-top:1px solid #e8f4e855}.pitch:after{content:'';position:absolute;width:78px;height:78px;border:1px solid #e8f4e855;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}.pitch-lines{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:space-around;gap:12px;min-height:285px}.pitch-line{display:flex;justify-content:space-evenly;align-items:center;gap:4px}.pitch-player{display:flex;flex-direction:column;align-items:center;gap:2px;max-width:65px;min-width:0;text-align:center;color:#fff;text-shadow:0 1px 3px #000;font-size:9px;font-weight:800;line-height:1.25}.player-avatar{width:31px;height:31px;border-radius:50%;border:2px solid #f3d68d;background:#132b23;display:grid;place-items:center;overflow:hidden;font-size:10px;color:#f5d995}.player-avatar img{width:100%;height:100%;object-fit:cover}.player-number{font-size:10px;color:#ffe5a8}.player-name{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}.bench{margin-top:10px;border-top:1px solid #ffffff20;padding-top:9px}.bench-title{font-size:11px;color:var(--gold2);font-weight:900;margin-bottom:6px}.bench-list{display:flex;flex-wrap:wrap;gap:6px}.bench-player{font-size:10px;background:#1a2634;border:1px solid #2d3b4d;border-radius:7px;padding:4px 7px;color:#dce4ee}.lineup-empty{color:var(--muted);font-size:12px;text-align:center;padding:25px 8px}.lineup-foot{font-size:10px;color:#8292a6;margin-top:9px}@media(max-width:650px){.lineups-grid{grid-template-columns:1fr}.pitch{min-height:310px}.pitch-lines{min-height:265px}}
.live-player{background:linear-gradient(145deg,#111c2b,#080d15);border:1px solid #34465c;border-radius:15px;padding:16px;margin:15px 0}.live-player-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.live-player-head h2{margin:0;font-size:16px}.live-pill{background:#4c1721;color:#ffb2b8;border:1px solid #a43b4b;border-radius:30px;padding:4px 10px;font-size:10px;font-weight:900}.player-screen{position:relative;aspect-ratio:16/9;display:grid;place-items:center;text-align:center;padding:20px;overflow:hidden;background:radial-gradient(ellipse at center,#23364c,#05090e 70%);border:1px solid #26384b;border-radius:10px;color:#aebdce}.player-screen strong{display:block;color:#f4d68f;font-size:15px;margin-bottom:7px}.player-screen:after{content:'MANDO SPORT';position:absolute;right:16px;bottom:10px;color:#ffffff20;font-size:clamp(18px,5vw,34px);font-weight:1000;letter-spacing:2px;pointer-events:none}.player-brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:950;letter-spacing:.5px;color:#f5f6f8}.player-brand b{color:var(--gold2)}.player-brand-mark{width:28px;height:28px;display:grid;place-items:center;border:1px solid #8d6c35;border-radius:8px;color:var(--gold2);background:#e2b85f12;font-size:10px}.player-note{font-size:10px;color:#8595a8;margin:10px 0 0}@media(max-width:600px){.teams{grid-template-columns:1fr 80px 1fr;gap:5px}.team img{width:52px;height:52px}.score{font-size:24px}.top{gap:8px}.subnav{width:100%;order:3}}</style></head><body><header class="top"><a class="brand" href="/">MANDO <b>SPORT</b></a><a href="/">العودة للرئيسية ←</a><nav class="subnav" aria-label="التنقل السريع"><a href="/">الرئيسية</a><a href="/#matches">مباريات اليوم</a><a href="/#news">آخر الأخبار</a><a href="/competition.html?code=CL">دوري الأبطال</a><a href="/search.html">بحث</a><a href="/scorers.html">الهدافون</a></nav></header>
<main class="container"><div class="crumb"><a href="/" style="color:inherit">الرئيسية</a> › مركز المباراة</div><div id="match-root" class="statebox">جارٍ تحميل تفاصيل المباراة...</div></main>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{const root=document.getElementById('match-root'),p=new URLSearchParams(location.search),id=p.get('id'),competition=p.get('competition')||'PL';if(!id){root.textContent='رابط المباراة غير صحيح.';return;}
try{const r=await fetch('/api/match?id='+encodeURIComponent(id)+'&competition='+encodeURIComponent(competition));const d=await r.json();if(!r.ok)throw new Error(d.error||'تعذر تحميل المباراة');const m=d.match;document.title=(m.name||'مركز المباراة')+' | MANDO SPORT';const score=(m.home.score!==null&&m.away.score!==null)?esc(m.home.score)+' - '+esc(m.away.score):'—';root.className='';
const live=['in','paused'].includes(String(m.state||'').toLowerCase())||/جارية|مباشر|الشوط|استراحة/i.test(m.status||'');
const watchGuide='<section class="panel"><h2>المشاهدة الرسمية للمباراة</h2><p style="font-size:12px;color:#c3cedb">يمكنك التحقق من المباريات المجانية المتاحة عبر FIFA+ على DAZN حسب بلدك وحقوق البطولة.</p><a href="https://www.plus.fifa.com/" target="_blank" rel="noopener noreferrer" style="display:inline-block;background:#1b8b57;color:#fff;padding:10px 16px;border-radius:9px;font-weight:900;font-size:12px">تحقق من FIFA+ للمشاهدة المجانية ←</a><p style="font-size:10px;color:#8595a8;margin:10px 0 0">MANDO SPORT لا يبث المباريات مباشرة، ولا يضمن توفر هذه المباراة على FIFA+؛ التوفر يختلف حسب البلد والحقوق.</p></section>';
const player='<section class="live-player"><div class="live-player-head"><div class="player-brand"><span class="player-brand-mark">MS</span><span>MANDO <b>SPORT</b></span></div>'+(live?'<span class="live-pill">● مباشر الآن</span>':'<span class="state">مركز المباراة</span>')+'</div><div class="player-screen"><div><strong>'+(live?'البث غير متاح حالياً':'سيظهر البث عند انطلاق المباراة')+'</strong><span>سيظهر هنا البث العربي الرسمي عند توفر مصدر يسمح بالتشغيل داخل الموقع.</span></div></div><p class="player-note">المشاهدة لم تُفعّل بعد. ستظهر خيارات الجودة والمصادر المتاحة بعد ربط بث رسمي مرخّص.</p></section>';
const lineupHtml=(d.lineups||[]).length?'<section class="panel"><h2>تشكيلة الفريقين ومراكز اللاعبين</h2><div class="lineups-grid">'+d.lineups.map((team,index)=>{const starters=team.starters||[];const teamLogo=index===0?m.home.logo:m.away.logo;const groups=[['هجوم',/^(F|FW|ST|W|CF|LW|RW|ATT)$/],['وسط',/^(M|MF|AM|DM|CM|LM|RM)$/],['دفاع',/^(D|DF|CB|LB|RB|LWB|RWB|WB)$/],['حراسة',/^(G|GK|GOALKEEPER)$/]];const buckets=groups.map(g=>starters.filter(p=>g[1].test(String(p.positionCode||p.position||'').toUpperCase()))).filter(g=>g.length);const arranged=buckets.length?buckets:starters.map(p=>[p]);const lines=arranged.map(group=>'<div class="pitch-line">'+group.map(p=>'<div class="pitch-player"><div class="player-avatar">'+(p.photo?'<img src="'+esc(p.photo)+'" alt="" loading="lazy">':esc((p.name||'?').slice(0,1)))+'</div><span class="player-number">#'+esc(p.number||'—')+'</span><span class="player-name">'+esc(p.name)+'</span></div>').join('')+'</div>').join('');return '<article class="lineup-card"><div class="lineup-head">'+(teamLogo?'<img src="'+esc(teamLogo)+'" alt="">':'')+'<span>'+esc(team.team)+'</span><span class="formation">'+esc(team.formation||'التشكيلة الأساسية')+'</span></div>'+(starters.length?'<div class="pitch"><div class="pitch-lines">'+lines+'</div></div>':'<div class="lineup-empty">لم تُعلن التشكيلة الرسمية لهذه المباراة بعد.</div>')+(team.substitutes?.length?'<div class="bench"><div class="bench-title">دكة البدلاء</div><div class="bench-list">'+team.substitutes.map(p=>'<span class="bench-player">#'+esc(p.number||'—')+' '+esc(p.name)+'</span>').join('')+'</div></div>':'')+'</article>';}).join('')+'</div><div class="lineup-foot">تُعرض التشكيلة عند توفرها من مزوّد بيانات المباراة، وقد تتغير قبل انطلاق اللقاء.</div></section>':'<section class="panel"><h2>تشكيلة الفريقين ومراكز اللاعبين</h2><div class="lineup-empty">التشكيلات لم تُعلن أو لم تتوفر بياناتها لهذه المباراة بعد.</div></section>';
root.innerHTML='<section class="scoreboard"><div class="comp">'+esc(m.competition||'كرة القدم')+'</div><div class="teams"><div class="team">'+(m.home.logo?'<img src="'+esc(m.home.logo)+'" alt="">':'⚽')+'<a href="/team.html?league='+encodeURIComponent(competition)+'&id='+encodeURIComponent(m.home.id||"")+'">'+esc(m.home.name)+'</a></div><div><div class="score">'+score+'</div><div class="state">'+esc(m.status||'موعد المباراة')+'</div></div><div class="team">'+(m.away.logo?'<img src="'+esc(m.away.logo)+'" alt="">':'⚽')+'<a href="/team.html?league='+encodeURIComponent(competition)+'&id='+encodeURIComponent(m.away.id||"")+'">'+esc(m.away.name)+'</a></div></div><div class="venue">'+(m.date?new Date(m.date).toLocaleString('ar',{dateStyle:'medium',timeStyle:'short'})+' · ':'')+esc(m.venue)+(m.city?' · '+esc(m.city):'')+'</div></section>'+player+watchGuide+lineupHtml+
(d.statistics?.length?'<section class="panel"><h2>أرقام الفريقين</h2>'+d.statistics.map(group=>'<h3 style="font-size:13px;color:#9a742e">'+esc(group.team)+'</h3>'+group.statistics.map(s=>'<div class="statrow"><strong>'+esc(s.value)+'</strong><span>'+esc(s.name)+'</span><strong></strong></div>').join('')).join('')+'</section>':'')+
(d.events?.length?'<section class="panel"><h2>أحداث المباراة</h2>'+d.events.map(e=>'<div class="event"><small>'+esc(e.clock||e.period||'')+'</small>'+esc(e.text)+(e.team?' · '+esc(e.team):'')+'</div>').join('')+'</section>':'<section class="panel"><h2>أحداث المباراة</h2><div class="statebox">لا توجد أحداث مسجلة لهذه المباراة بعد.</div></section>')+
(d.articles?.length?'<section class="panel"><h2>تغطية ومقالات مرتبطة</h2>'+d.articles.map(a=>'<div class="event"><a href="'+esc(a.url)+'" target="_blank" rel="noopener noreferrer">'+esc(a.title)+' ←</a></div>').join('')+'</section>':'');
}catch(e){root.textContent=e.message;}})();
</script></body></html>
