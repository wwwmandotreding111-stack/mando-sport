<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172433"><title>مركز المباراة | MANDO SPORT</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f3f5;color:#263442;font-family:Tahoma,Arial,sans-serif;line-height:1.8}.top{display:flex;justify-content:space-between;align-items:center;padding:14px 4%;background:#fff;border-bottom:1px solid #e0e5ea}.brand{font-size:21px;font-weight:950;color:#1d2b3a;text-decoration:none}.brand b{color:#b98937}.top a:last-child{font-size:12px;color:#926b2b;text-decoration:none}.container{width:min(1050px,94%);margin:24px auto}.crumb{font-size:11px;color:#8994a0;margin-bottom:12px}.panel{background:#fff;border:1px solid #e0e5ea;border-radius:9px;padding:17px;margin-bottom:14px}.scoreboard{background:linear-gradient(115deg,#1a2938,#30475b);color:#fff;padding:25px;border-radius:10px;text-align:center}.comp{font-size:12px;color:#f1d18b}.teams{display:grid;grid-template-columns:1fr 130px 1fr;align-items:center;gap:10px;margin:18px 0}.team{display:grid;justify-items:center;gap:8px;font-weight:900}.team img{width:70px;height:70px;object-fit:contain}.score{font-size:30px;font-weight:950}.state{font-size:12px;color:#d5dde5}.venue{font-size:11px;color:#d1d9e1}.panel h2{font-size:17px;margin:0 0 12px}.statrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;border-bottom:1px solid #eef0f3;padding:8px 0;font-size:12px}.statrow span:nth-child(2){text-align:center;color:#8994a0}.statrow strong:last-child{text-align:left}.event{padding:9px 0;border-bottom:1px solid #eef0f3;font-size:12px}.event small{color:#9a742e;margin-left:8px}.statebox{text-align:center;padding:35px;color:#8793a0;font-size:13px}@media(max-width:600px){.teams{grid-template-columns:1fr 80px 1fr}.team img{width:52px;height:52px}.score{font-size:23px}.panel{padding:13px}}
</style></head><body><header class="top"><a class="brand" href="/">MANDO <b>SPORT</b></a><a href="/">العودة للرئيسية ←</a></header>
<main class="container"><div class="crumb"><a href="/" style="color:inherit">الرئيسية</a> › مركز المباراة</div><div id="match-root" class="statebox">جارٍ تحميل تفاصيل المباراة...</div></main>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{const root=document.getElementById('match-root'),p=new URLSearchParams(location.search),id=p.get('id'),competition=p.get('competition')||'PL';if(!id){root.textContent='رابط المباراة غير صحيح.';return;}
try{const r=await fetch('/api/match?id='+encodeURIComponent(id)+'&competition='+encodeURIComponent(competition));const d=await r.json();if(!r.ok)throw new Error(d.error||'تعذر تحميل المباراة');const m=d.match;document.title=(m.name||'مركز المباراة')+' | MANDO SPORT';const score=(m.home.score!==null&&m.away.score!==null)?esc(m.home.score)+' - '+esc(m.away.score):'—';root.className='';
root.innerHTML='<section class="scoreboard"><div class="comp">'+esc(m.competition||'كرة القدم')+'</div><div class="teams"><div class="team">'+(m.home.logo?'<img src="'+esc(m.home.logo)+'" alt="">':'⚽')+'<a href="/team.html?league='+encodeURIComponent(competition)+'&id='+encodeURIComponent(m.home.id||"")+'">'+esc(m.home.name)+'</a></div><div><div class="score">'+score+'</div><div class="state">'+esc(m.status||'موعد المباراة')+'</div></div><div class="team">'+(m.away.logo?'<img src="'+esc(m.away.logo)+'" alt="">':'⚽')+'<a href="/team.html?league='+encodeURIComponent(competition)+'&id='+encodeURIComponent(m.away.id||"")+'">'+esc(m.away.name)+'</a></div></div><div class="venue">'+(m.date?new Date(m.date).toLocaleString('ar',{dateStyle:'medium',timeStyle:'short'})+' · ':'')+esc(m.venue)+(m.city?' · '+esc(m.city):'')+'</div></section>'+
(d.statistics?.length?'<section class="panel"><h2>أرقام الفريقين</h2>'+d.statistics.map(group=>'<h3 style="font-size:13px;color:#9a742e">'+esc(group.team)+'</h3>'+group.statistics.map(s=>'<div class="statrow"><strong>'+esc(s.value)+'</strong><span>'+esc(s.name)+'</span><strong></strong></div>').join('')).join('')+'</section>':'')+
(d.events?.length?'<section class="panel"><h2>أحداث المباراة</h2>'+d.events.map(e=>'<div class="event"><small>'+esc(e.clock||e.period||'')+'</small>'+esc(e.text)+(e.team?' · '+esc(e.team):'')+'</div>').join('')+'</section>':'<section class="panel"><h2>أحداث المباراة</h2><div class="statebox">لا توجد أحداث مسجلة لهذه المباراة بعد.</div></section>')+
(d.articles?.length?'<section class="panel"><h2>تغطية ومقالات مرتبطة</h2>'+d.articles.map(a=>'<div class="event"><a href="'+esc(a.url)+'" target="_blank" rel="noopener noreferrer">'+esc(a.title)+' ←</a></div>').join('')+'</section>':'');
}catch(e){root.textContent=e.message;}})();
</script></body></html>
