<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#172433"><title>خبر رياضي | MANDO SPORT</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f3f5;color:#253344;font-family:Tahoma,Arial,sans-serif;line-height:1.9}a{color:inherit;text-decoration:none}.top{background:#fff;border-bottom:1px solid #e1e5ea;padding:14px 4%;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;font-size:21px;color:#1d2b3a}.brand b{color:#b98937}.top a:last-child{font-size:12px;color:#8d6829;font-weight:800}.container{width:min(900px,92%);margin:25px auto}.crumb{font-size:11px;color:#8a95a2;margin-bottom:12px}.article{background:#fff;border:1px solid #e0e5ea;border-radius:10px;overflow:hidden;box-shadow:0 3px 14px #18243308}.article-body{padding:clamp(18px,4vw,38px)}.category{font-size:12px;color:#a1782d;font-weight:900}.article h1{font-size:clamp(24px,4vw,38px);line-height:1.55;margin:10px 0;color:#1e2c3a}.meta{font-size:11px;color:#87919d;border-bottom:1px solid #edf0f3;padding-bottom:15px;margin-bottom:20px}.cover{width:100%;max-height:470px;object-fit:cover;display:block;background:#e8edf1}.excerpt{font-size:16px;color:#526172;font-weight:700}.body{font-size:15px;white-space:pre-wrap;color:#364353}.source{margin-top:25px;padding:12px;background:#f6f7f9;border-radius:7px;font-size:11px;color:#7b8795}.state{text-align:center;padding:45px 15px;color:#788493}.back{display:inline-block;margin:18px 0;color:#91691f;font-weight:800;font-size:13px}footer{text-align:center;color:#8b95a1;font-size:11px;padding:25px}
</style>
<style id="mando-subpage-premium">
:root{color-scheme:dark;--bg:#07111b;--surface:#0d1a27;--surface2:#122334;--line:#294054;--text:#edf3f8;--muted:#9aabba;--gold:#d9ad5b;--gold2:#f2d18b}
body{background:radial-gradient(ellipse at 50% -18%,#263d5355,transparent 44%),var(--bg)!important;color:var(--text)!important;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif!important}
.top{position:sticky;top:0;z-index:50;background:#07111bf2!important;border-bottom:1px solid #d9ad5b45!important;box-shadow:0 8px 28px #0003;backdrop-filter:blur(18px);padding:14px max(3%,calc((100% - 1200px)/2))!important}
.brand{color:#fff!important;font-weight:1000!important;letter-spacing:.5px}
.brand b{color:var(--gold2)!important}
.top a:last-child{color:var(--gold2)!important}
.container{margin:28px auto!important}
.searchbar,.section,.article{background:linear-gradient(155deg,#102030,#0c1925)!important;border:1px solid #294054!important;border-radius:13px!important;box-shadow:0 8px 26px #0002!important}
.searchbar{padding:17px!important}
.searchbar input{background:#081622!important;border:1px solid #344b60!important;color:#fff!important;border-radius:8px!important;padding:12px!important}
.searchbar button{background:linear-gradient(145deg,#f0d18d,#c29142)!important;color:#172432!important;border:0!important;border-radius:8px!important;font-weight:950!important;cursor:pointer}
.section{padding:18px!important}
.section h2{color:#f1f5f8!important}
.result{background:#0b1925!important;border:1px solid #293f53!important;border-radius:9px!important;color:#edf3f8!important;transition:.18s}
.result:hover{border-color:#c69a4e!important;transform:translateY(-2px)}
.result img{background:#172a3c!important;border-radius:8px!important}
.result strong{color:#f1f5f8!important}
.result small,.state{color:#91a4b6!important}
.state{padding:25px!important}
.article{overflow:hidden!important}
.article-body{padding:clamp(18px,4vw,40px)!important}
.category{color:var(--gold2)!important}
.article h1{color:#fff!important;line-height:1.55!important}
.meta{color:#91a4b6!important;border-color:#ffffff18!important}
.excerpt{color:#c4d1dc!important}
.body{color:#d5dfe8!important}
.source{background:#142536!important;color:#a9bac9!important}
.crumb{color:#91a4b6!important}
.back{color:var(--gold2)!important}
footer{color:#8296a9!important}
@media(max-width:650px){.container{margin:15px auto!important}.searchbar{padding:11px!important}.section{padding:13px!important}.top{gap:8px}.results{grid-template-columns:1fr}}
</style>
</head><body>
<header class="top"><a class="brand" href="/">MANDO <b>SPORT</b></a><a href="/">العودة إلى الرئيسية ←</a></header>
<main class="container"><div class="crumb"><a href="/">الرئيسية</a> › الأخبار الرياضية</div><article id="article" class="article"><div class="state">جارٍ تحميل الخبر...</div></article><a class="back" href="/">← العودة إلى الصفحة الرئيسية</a></main>
<footer>© <span id="year"></span> MANDO SPORT</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
document.getElementById('year').textContent=new Date().getFullYear();
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{
 const host=document.getElementById('article'),id=new URLSearchParams(location.search).get('id');
 if(!id){host.innerHTML='<div class="state">رابط الخبر غير صحيح.</div>';return;}
 try{
  const db=window.supabase.createClient('https://ibgvfjuqcolcyjzdzcde.supabase.co','sb_publishable_f6rFbm1j-TyGod9sfqyriA_PregMmQ_');
  const {data,error}=await db.from('articles').select('id,title,excerpt,body,image_url,category,created_at').eq('id',id).eq('published',true).single();
  if(error||!data)throw error||new Error('الخبر غير متاح');
  document.title=data.title+' | MANDO SPORT';
  host.innerHTML=(data.image_url?'<img class="cover" src="'+safe(data.image_url)+'" alt="">':'')+'<div class="article-body"><div class="category">'+safe(data.category||'أخبار كرة القدم')+'</div><h1>'+safe(data.title)+'</h1><div class="meta">MANDO SPORT · '+new Date(data.created_at).toLocaleString('ar',{dateStyle:'long',timeStyle:'short'})+'</div>'+(data.excerpt?'<p class="excerpt">'+safe(data.excerpt)+'</p>':'')+'<div class="body">'+safe(data.body||data.excerpt||'')+'</div></div>';
 }catch(e){host.innerHTML='<div class="state">تعذر العثور على الخبر. ربما أُزيل أو لم يعد منشوراً.</div>';}
})();
</script></body></html>
