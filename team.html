<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صفحة الفريق | MANDO SPORT</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f1f3f5;color:#263442;font-family:Tahoma,Arial,sans-serif;line-height:1.8}.top{background:#fff;padding:14px 4%;border-bottom:1px solid #e0e5ea;display:flex;justify-content:space-between}.brand{font-weight:950;font-size:21px;color:#1d2b3a;text-decoration:none}.brand b{color:#b98937}.top a:last-child{font-size:12px;color:#926b2b;text-decoration:none}.container{width:min(1050px,94%);margin:24px auto}.hero{background:linear-gradient(115deg,#1b2a39,#30475b);color:#fff;padding:25px;border-radius:10px;display:flex;align-items:center;gap:20px}.hero img{width:90px;height:90px;object-fit:contain}.hero h1{margin:0;font-size:26px}.hero p{margin:5px 0;color:#d4dce4;font-size:12px}.panel{background:#fff;border:1px solid #e0e5ea;border-radius:9px;padding:16px;margin-top:14px}.panel h2{margin:0 0 12px;font-size:17px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.player{display:flex;gap:9px;align-items:center;padding:9px;border:1px solid #e8ebef;border-radius:7px}.player img{width:42px;height:42px;object-fit:contain;border-radius:50%;background:#f3f5f7}.player strong{font-size:12px}.player small{display:block;color:#8893a0;font-size:10px}.fixture{padding:10px 0;border-bottom:1px solid #edf0f3;font-size:12px}.fixture small{color:#8b96a3;display:block}@media(max-width:650px){.grid{grid-template-columns:1fr}.hero img{width:65px;height:65px}.hero h1{font-size:21px}}</style></head><body><header class="top"><a class="brand" href="/">MANDO <b>SPORT</b></a><a href="/">العودة للرئيسية ←</a></header><main class="container"><div id="team-root" class="panel">جارٍ تحميل صفحة الفريق...</div></main>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{const root=document.getElementById('team-root'),p=new URLSearchParams(location.search),id=p.get('id'),league=p.get('league')||'eng.1',fallbackName=p.get('name')||'',fallbackImage=p.get('image')||'';if(!id){root.textContent='رابط الفريق غير صحيح.';return;}try{const r=await fetch('/api/team?id='+encodeURIComponent(id)+'&league='+encodeURIComponent(league));const d=await r.json();if(!r.ok)throw new Error(d.error||'تعذر تحميل الفريق');const t=d.team||{},teamName=t.name||fallbackName,teamLogo=t.logo||fallbackImage;document.title=teamName+' | MANDO SPORT';root.className='';root.innerHTML='<section class="hero">'+(teamLogo?'<img src="'+esc(teamLogo)+'" alt="">':'')+'<div><h1>'+esc(teamName)+'</h1><p>'+esc(t.location)+' '+esc(t.nickname)+'</p><p>'+esc(t.venue)+' · '+esc(t.record)+'</p></div></section><section class="panel"><h2>قائمة اللاعبين</h2><div class="grid">'+(d.roster||[]).map(x=>'<a class="player" href="/player.html?league='+encodeURIComponent(league)+'&id='+encodeURIComponent(x.id)+'">'+(x.image?'<img src="'+esc(x.image)+'" alt="">':'')+'<span><strong>'+esc(x.name)+'</strong><small>'+esc(x.position)+(x.number?' · #'+esc(x.number):'')+'</small></span></a>').join('')+'</div></section><section class="panel"><h2>مباريات الفريق</h2>'+((d.events||[]).map(e=>'<div class="fixture">'+esc(e.home)+' · '+esc(e.homeScore??'—')+' - '+esc(e.awayScore??'—')+' · '+esc(e.away)+'<small>'+new Date(e.date).toLocaleString('ar')+' · '+esc(e.status)+'</small></div>').join('')||'<p>لا توجد مباريات متاحة حالياً.</p>')+'</section>';}catch(e){root.textContent=e.message;}})();
</script></body></html>
