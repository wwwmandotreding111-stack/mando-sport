<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صفحة الفريق | MANDO SPORT</title>
<style>*{box-sizing:border-box}:root{color-scheme:dark;--bg:#080a0f;--panel:#111722;--gold:#e2b85f;--gold2:#f5d995;--muted:#98a4b5;--line:#273244;--white:#f5f6f8}body{margin:0;background:radial-gradient(ellipse at 50% -18%,#45321755,transparent 42%),var(--bg);color:var(--white);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.75}a{color:inherit;text-decoration:none}.top{position:sticky;top:0;z-index:20;background:#080a0fee;border-bottom:1px solid #ffffff14;backdrop-filter:blur(16px);padding:12px max(4%,calc((100% - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.brand{font-size:21px;font-weight:950;color:#f5f6f8}.brand b{color:var(--gold)}.top>a:last-child{font-size:12px;color:var(--gold2)}.subnav{display:flex;gap:7px;overflow:auto;white-space:nowrap}.subnav a{font-size:12px;color:#c0cad7;padding:7px 10px;border-radius:8px}.subnav a:hover{background:#e2b85f18;color:var(--gold2)}.container{width:min(1050px,94%);margin:24px auto}.hero{background:radial-gradient(ellipse at 85% 25%,#b7833440,transparent 40%),linear-gradient(115deg,#1b202a,#0b0e14);border:1px solid #6b5128;color:#fff;padding:25px;border-radius:17px;display:flex;align-items:center;gap:20px}.hero img{width:90px;height:90px;object-fit:contain}.hero h1{margin:0;font-size:26px}.hero p{margin:5px 0;color:#c3ccd8;font-size:12px}.panel{background:linear-gradient(145deg,#141c28,#0f151e);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}.panel h2{margin:0 0 12px;font-size:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.player{display:flex;gap:9px;align-items:center;padding:10px;background:#0c121b;border:1px solid #273244;border-radius:9px}.player:hover{border-color:#98763d}.player img{width:42px;height:42px;object-fit:contain;border-radius:50%;background:#202938}.player strong{font-size:12px}.player small{display:block;color:var(--muted);font-size:10px}.fixture{padding:11px 0;border-bottom:1px solid #273244;font-size:12px}.fixture small{color:var(--muted);display:block}@media(max-width:650px){.grid{grid-template-columns:1fr}.hero img{width:65px;height:65px}.hero h1{font-size:21px}.top{gap:8px}.subnav{width:100%;order:3}}</style></head><body><header class="top"><a class="brand" href="/">MANDO <b>SPORT</b></a><a href="/">العودة للرئيسية ←</a><nav class="subnav" aria-label="التنقل السريع"><a href="/">الرئيسية</a><a href="/#matches">مباريات اليوم</a><a href="/#news">آخر الأخبار</a><a href="/competition.html?code=CL">دوري الأبطال</a><a href="/search.html">بحث</a><a href="/scorers.html">الهدافون</a></nav></header><main class="container"><div id="team-root" class="panel">جارٍ تحميل صفحة الفريق...</div></main>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{const root=document.getElementById('team-root'),p=new URLSearchParams(location.search),id=p.get('id'),league=p.get('league')||'eng.1',fallbackName=p.get('name')||'',fallbackImage=p.get('image')||'';if(!id){root.textContent='رابط الفريق غير صحيح.';return;}try{const r=await fetch('/api/team?id='+encodeURIComponent(id)+'&league='+encodeURIComponent(league));const d=await r.json();if(!r.ok)throw new Error(d.error||'تعذر تحميل الفريق');const t=d.team||{},teamName=t.name||fallbackName,teamLogo=t.logo||fallbackImage;document.title=teamName+' | MANDO SPORT';root.className='';root.innerHTML='<section class="hero">'+(teamLogo?'<img src="'+esc(teamLogo)+'" alt="">':'')+'<div><h1>'+esc(teamName)+'</h1><p>'+esc(t.location)+' '+esc(t.nickname)+'</p><p>'+esc(t.venue)+' · '+esc(t.record)+'</p></div></section><section class="panel"><h2>قائمة اللاعبين</h2><div class="grid">'+(d.roster||[]).map(x=>'<a class="player" href="/player.html?league='+encodeURIComponent(league)+'&id='+encodeURIComponent(x.id)+'&name='+encodeURIComponent(x.name)+'&image='+encodeURIComponent(x.image||'')+'&description='+encodeURIComponent(x.position||'')>'+(x.image?'<img src="'+esc(x.image)+'" alt="">':'')+'<span><strong>'+esc(x.name)+'</strong><small>'+esc(x.position)+(x.number?' · #'+esc(x.number):'')+'</small></span></a>').join('')+'</div></section><section class="panel"><h2>مباريات الفريق</h2>'+((d.events||[]).map(e=>'<div class="fixture">'+esc(e.home)+' · '+esc(e.homeScore??'—')+' - '+esc(e.awayScore??'—')+' · '+esc(e.away)+'<small>'+new Date(e.date).toLocaleString('ar')+' · '+esc(e.status)+'</small></div>').join('')||'<p>لا توجد مباريات متاحة حالياً.</p>')+'</section>';}catch(e){if(fallbackName){root.className='';root.innerHTML='<section class="hero">'+(fallbackImage?'<img src="'+esc(fallbackImage)+'" alt="">':'')+'<div><h1>'+esc(fallbackName)+'</h1><p>صفحة الفريق من مصدر البيانات الرياضي.</p></div></section>';}else root.textContent=e.message;}})();
</script></body></html>
