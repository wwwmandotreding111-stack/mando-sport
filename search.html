<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172433"><title>البحث الرياضي | MANDO SPORT</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f3f5;color:#253344;font-family:Tahoma,Arial,sans-serif;line-height:1.8}a{color:inherit;text-decoration:none}.top{background:#fff;border-bottom:1px solid #e1e5ea;padding:14px 4%;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;font-size:21px;color:#1d2b3a}.brand b{color:#b98937}.top a:last-child{font-size:12px;color:#8d6829;font-weight:800}.container{width:min(1100px,94%);margin:25px auto}.searchbar{display:flex;gap:8px;background:#fff;padding:15px;border:1px solid #e0e5ea;border-radius:9px}.searchbar input{flex:1;min-width:0;border:1px solid #dfe4e9;border-radius:6px;padding:11px;font:inherit}.searchbar button{background:#27394b;color:#fff;border:0;border-radius:6px;padding:10px 18px;font-weight:800}.section{background:#fff;border:1px solid #e0e5ea;border-radius:9px;padding:17px;margin-top:15px}.section h2{font-size:17px;margin:0 0 12px}.results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.result{border:1px solid #e6e9ed;border-radius:7px;padding:12px;display:flex;gap:10px;align-items:center;min-width:0}.result img{width:48px;height:48px;object-fit:contain;background:#f4f6f8;border-radius:7px;padding:4px}.result strong{display:block;font-size:13px}.result small{font-size:10px;color:#87919d}.state{padding:20px;text-align:center;color:#8994a1;font-size:12px}@media(max-width:650px){.results{grid-template-columns:1fr}.searchbar{padding:10px}.result{padding:9px}}
</style></head><body><header class="top"><a class="brand" href="/">MANDO <b>SPORT</b></a><a href="/">العودة للرئيسية ←</a></header>
<main class="container"><form class="searchbar" id="search-form"><input id="q" type="search" placeholder="ابحث عن لاعب أو فريق أو بطولة..." aria-label="كلمة البحث" required><button>بحث</button></form>
<section class="section"><h2>نتائج البحث الرياضي</h2><div id="sports-results" class="results"><div class="state">اكتب اسم لاعب أو فريق للبدء.</div></div></section>
<section class="section"><h2>أخبار مرتبطة بالبحث</h2><div id="article-results" class="results"><div class="state">تظهر هنا الأخبار المنشورة في MANDO SPORT.</div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params=new URLSearchParams(location.search),initial=params.get('q')||'';document.getElementById('q').value=initial;
async function search(q){
 const sports=document.getElementById('sports-results'),articles=document.getElementById('article-results');sports.innerHTML='<div class="state">جارٍ البحث...</div>';articles.innerHTML='<div class="state">جارٍ البحث في أخبار الموقع...</div>';
 try{const r=await fetch('/api/search?q='+encodeURIComponent(q));const d=await r.json();if(!r.ok)throw new Error(d.error||'تعذر البحث');sports.innerHTML=d.items?.length?d.items.map(x=>'<a class="result" href="'+safe(x.url)+'" target="_blank" rel="noopener noreferrer">'+(x.image?'<img src="'+safe(x.image)+'" alt="">':'<img src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22%3E%3Ctext x=%2224%22 y=%2235%22 text-anchor=%22middle%22 font-size=%2230%22%3E⚽%3C/text%3E%3C/svg%3E" alt="">')+'<span><strong>'+safe(x.title)+'</strong><small>'+safe(x.type)+' · ESPN</small></span></a>').join(''):'<div class="state">ما لقينا نتائج رياضية مطابقة.</div>';}catch(e){sports.innerHTML='<div class="state">'+safe(e.message)+'</div>';}
 try{const db=window.supabase.createClient('https://ibgvfjuqcolcyjzdzcde.supabase.co','sb_publishable_f6rFbm1j-TyGod9sfqyriA_PregMmQ_');const {data,error}=await db.from('articles').select('id,title,excerpt,category').eq('published',true).ilike('title','%'+q.replace(/[%_]/g,'')+'%').order('created_at',{ascending:false}).limit(12);if(error)throw error;articles.innerHTML=data?.length?data.map(a=>'<a class="result" href="/article.html?id='+encodeURIComponent(a.id)+'"><span><strong>'+safe(a.title)+'</strong><small>'+safe(a.category||'أخبار كرة القدم')+' · MANDO SPORT</small></span></a>').join(''):'<div class="state">لا توجد أخبار منشورة مطابقة.</div>';}catch(e){articles.innerHTML='<div class="state">تعذر البحث في أخبار الموقع.</div>';}
}
document.getElementById('search-form').addEventListener('submit',e=>{e.preventDefault();const q=document.getElementById('q').value.trim();if(q){history.replaceState(null,'','?q='+encodeURIComponent(q));search(q);}});if(initial.length>1)search(initial);
</script></body></html>
